name: Deploy

# The site had no CI at all: `npm run deploy` from a laptop was the only way it ever shipped, so
# what was live depended on who last ran it and from which branch. That is also why the Press
# board's `publish` stage could not be autonomous — an agent that merges a post would have had
# nothing to publish it.
#
# `master` is this repo's default branch, not `main`.
on:
  push:
    branches: [master]
  # A deploy you cannot re-run by hand is a deploy you cannot recover.
  workflow_dispatch:

# One deploy at a time, and let a newer commit win: two overlapping `wrangler pages deploy` runs
# race to be the live version, and the loser is whichever finishes second rather than whichever is
# newer.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # `astro check` runs as part of `build`, so a type error stops the deploy rather than
      # shipping a page that renders wrong.
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Named rather than inferred: an unset secret here would otherwise reach wrangler as an
          # anonymous call and fail with an auth error that says nothing about which secret is
          # missing from which repository.
          : "${CLOUDFLARE_API_TOKEN:?set the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?set the CLOUDFLARE_ACCOUNT_ID repository secret}"
          # Same project and branch the manual `npm run deploy` has always used, so this replaces
          # that command rather than creating a second deployment target beside it.
          npx wrangler pages deploy dist \
            --project-name=extinct-eclipse \
            --branch=master
